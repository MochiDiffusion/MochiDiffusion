# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    # Not Mochi's own dependencies: ml-stable-diffusion requires them, and pins
    # swift-transformers to an exact version, so a newer release cannot resolve.
    ignore:
      - dependency-name: "github.com/huggingface/swift-transformers"
      - dependency-name: "github.com/apple/swift-argument-parser"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
