name: Gated Check-in

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    # project.xcproj needs Xcode 27, which GitHub ships on its own image.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          # The newest non-beta 27.2.x on the image.
          xcode-version: '27.2'

      - name: Install swift-format
        run: |
          brew update
          brew install swift-format

      - name: Lint using swift-format
        run: |
          /opt/homebrew/bin/swift-format lint -s -p -r ./

      - name: Build and Analyze
        run: >
          xcodebuild clean build analyze
          -disableAutomaticPackageResolution
          -project "Mochi Diffusion.xcodeproj"
          -scheme "Mochi Diffusion"
          CODE_SIGNING_ALLOWED=NO | xcbeautify && exit ${PIPESTATUS[0]}

      - name: Test
        run: >
          xcodebuild test
          -disableAutomaticPackageResolution
          -project "Mochi Diffusion.xcodeproj"
          -scheme "Mochi Diffusion"
          -destination "platform=macOS"
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO | xcbeautify && exit ${PIPESTATUS[0]}
